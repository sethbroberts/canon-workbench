<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canon Workbench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Canon Workbench</h1>
    <p class="sub">Type a melody; see it in canon with itself.</p>
  </header>

  <main>
    <section class="editor">
      <label for="melody">Melody</label>
      <textarea id="melody" spellcheck="false" rows="7">{{ example }}</textarea>
      <p class="hint">
        <code>C4/4</code> pitch + octave / duration &middot;
        <code>Bb3/8.</code> dotted &middot;
        <code>R/2</code> rest &middot;
        <code>~A4</code> tied from previous &middot;
        <code>|</code> barline &middot;
        <code>%</code> comment
      </p>

      <div class="settings">
        <label>Voices
          <input id="voices" type="number" min="1" max="8" value="{{ defaults.voices }}">
        </label>
        <label>Entry every
          <input id="delay_bars" type="number" min="0" step="1" value="{{ defaults.delay_bars }}"> bars
          + <input id="delay_beats" type="number" min="0" step="0.5" value="{{ defaults.delay_beats }}"> beats
        </label>
        <label>Each entry
          <select id="interval">
            {% for name, code in intervals.items() %}
              <option value="{{ code }}" {% if code == defaults.interval %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Times through
          <input id="repeats" type="number" min="1" max="8" value="{{ defaults.repeats }}">
        </label>
        <label>Ending
          <select id="ending">
            <option value="stagger">voices finish in turn</option>
            <option value="together">all stop together</option>
          </select>
        </label>
        <label>Meter
          <select id="time_signature">
            {% for ts in ["2/4", "3/4", "4/4", "3/2", "6/8", "2/2"] %}
              <option {% if ts == defaults.time_signature %}selected{% endif %}>{{ ts }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Key
          <input id="key" type="text" size="4" value="{{ defaults.key }}" title="C, F, Bb, a, f# (lowercase = minor)">
        </label>
      </div>

      <div id="messages" aria-live="polite"></div>
    </section>

    <section class="score">
      <div id="status"></div>
      <div id="score"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
